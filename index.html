<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Feliz Aniversario 💛</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    background: linear-gradient(180deg, #ffd1dc 0%, #ffb3c6 55%, #ffd6e0 100%);
    color: #8d3b57;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------- Login (calculadora) ---------- */
  #login {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #ffd1dc 0%, #ffb3c6 55%, #ffd6e0 100%);
    transition: opacity .6s ease;
  }
  #login.salir { opacity: 0; pointer-events: none; }

  .caja-login {
    background: rgba(255, 255, 255, 0.92);
    border-radius: 26px;
    padding: 30px 22px 24px;
    width: 88%;
    max-width: 360px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(179, 36, 79, 0.25);
  }
  .caja-login .icono { font-size: 2.6rem; margin-bottom: 6px; }
  .caja-login h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 5px; }
  .caja-login p { font-size: .9rem; opacity: .8; margin-bottom: 18px; font-weight: 600; line-height: 1.45; }

  /* Calculadora */
  .calc {
    background: linear-gradient(160deg, #e8d9f0, #f6ecf4);
    border-radius: 18px;
    padding: 14px;
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, .08), 0 8px 20px rgba(179, 36, 79, .14);
  }
  .calc-pantalla {
    background: #fff;
    border: 2px solid #ffd34d;
    border-radius: 12px;
    padding: 13px 16px;
    min-height: 56px;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: 2px;
    color: #b3244f;
    text-align: right;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    margin-bottom: 12px;
    overflow: hidden;
    white-space: nowrap;
  }
  .calc-pantalla.salta { animation: salta .35s ease; }
  @keyframes salta {
    0% { transform: translateY(0); }
    30% { transform: translateY(-4px); }
    60% { transform: translateY(2px); }
    100% { transform: translateY(0); }
  }
  .calc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
  }
  .tecla {
    border: none;
    border-radius: 12px;
    padding: 13px 0;
    font-size: 1.15rem;
    font-weight: 800;
    font-family: inherit;
    color: #8d3b57;
    background: #fff;
    box-shadow: 0 3px 0 rgba(179, 36, 79, .15);
    cursor: pointer;
    touch-action: manipulation;
    transition: transform .08s ease;
  }
  .tecla:active { transform: scale(.93); }
  .tecla.op {
    background: linear-gradient(135deg, #ffe37a, #ffb300);
    color: #7a4f00;
  }
  .tecla.cero { grid-column: span 2; }
  .tecla.igual {
    grid-column: span 2;
    background: linear-gradient(90deg, #ff6b8b, #e63963);
    color: #fff;
    font-size: 1.02rem;
    letter-spacing: 1px;
    box-shadow: 0 3px 0 rgba(180, 30, 80, .35);
  }

  #error {
    margin-top: 12px;
    font-size: .85rem;
    font-weight: 700;
    color: #e63963;
    opacity: 0;
    transition: opacity .3s;
  }
  #error.mostrar { opacity: 1; }
  .caja-login.temblar { animation: temblar .4s ease; }
  @keyframes temblar {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    50% { transform: translateX(8px); }
    75% { transform: translateX(-6px); }
  }

  /* ---------- Escena del tulipán ---------- */
  #escena {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 4vh 16px 40px;
    overflow-y: auto;
    opacity: 0;
    transform: scale(.94);
    transition: opacity .8s ease, transform .8s ease;
    pointer-events: none;
  }
  #escena.mostrar { opacity: 1; transform: scale(1); pointer-events: auto; }
  #escena > div { z-index: 2; }

  #escena h1 {
    font-size: 1.7rem;
    font-weight: 800;
    color: #b3244f;
    text-shadow: 0 2px 0 rgba(255,255,255,.5);
    margin-bottom: 4px;
    z-index: 2;
  }
  .pista {
    font-size: .95rem;
    font-weight: 700;
    opacity: .85;
    margin-bottom: 18px;
    z-index: 2;
    animation: latidoPista 1.6s ease-in-out infinite;
  }
  @keyframes latidoPista {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  /* Tulipán */
  .tulipan {
    width: min(78vw, 360px);
    cursor: pointer;
    touch-action: manipulation;
    position: relative;
    z-index: 2;
    animation: bamboleo 4s ease-in-out infinite;
    filter: drop-shadow(0 18px 30px rgba(179, 36, 79, .25));
  }
  @keyframes bamboleo {
    0%,100% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
  }
  .tulipan.florecer .flor { animation: florecer 1.1s cubic-bezier(.2,1.4,.3,1) both; }
  @keyframes florecer {
    from { transform: scale(.15) translateY(60px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  .tulipan:active { transform: scale(1.04); }

  /* Fotos polaroid bajo el tulipán */
  .fotos {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 26px;
    flex-wrap: wrap;
    width: 100%;
  }
  .fotos img {
    width: min(46vw, 190px);
    height: min(46vw, 190px);
    object-fit: cover;
    border-radius: 16px;
    border: 5px solid #fff;
    box-shadow: 0 10px 24px rgba(179, 36, 79, .3);
  }
  .fotos img:nth-child(1) { transform: rotate(-5deg); }
  .fotos img:nth-child(2) { transform: rotate(3deg) translateY(-8px); }
  .fotos img:nth-child(3) { transform: rotate(-2deg); }
  .fotos img:nth-child(4) { transform: rotate(4deg) translateY(-4px); }

  /* Corazones amarillos alrededor */
  .corazon-bg {
    position: fixed;
    bottom: -50px;
    font-size: 24px;
    color: rgba(255, 211, 77, .9);
    z-index: 0;
    pointer-events: none;
    animation: subir linear infinite;
  }
  @keyframes subir {
    0% { transform: translateY(0) rotate(0); opacity: 0; }
    12% { opacity: .8; }
    100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
  }

  /* ---------- Mensaje final ---------- */
  #mensaje {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    overflow-y: auto;
    text-align: center;
    background: linear-gradient(160deg, rgba(230,57,99,.97), rgba(161,140,209,.97));
    color: #fff;
    padding: 26px 20px 46px;
  }
  #mensaje.mostrar { display: flex; }
  #mensaje .teamo {
    font-size: clamp(2.6rem, 12vw, 4.5rem);
    font-weight: 900;
    text-shadow: 0 4px 18px rgba(0,0,0,.3);
    animation: aparecer .7s cubic-bezier(.2,1.4,.3,1) both;
  }
  #mensaje .frase {
    margin-top: 18px;
    font-size: clamp(1.1rem, 5vw, 1.5rem);
    font-weight: 700;
    max-width: 420px;
    line-height: 1.6;
    animation: aparecer .7s .35s cubic-bezier(.2,1.4,.3,1) both;
  }
  #mensaje .emoji {
    font-size: 4rem;
    margin-top: 20px;
    animation: aparecer .7s .55s cubic-bezier(.2,1.4,.3,1) both;
  }

  /* Galería dentro del mensaje final */
  .galeria {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 22px;
    flex-wrap: wrap;
    animation: aparecer .7s .7s cubic-bezier(.2,1.4,.3,1) both;
  }
  .galeria img {
    width: min(38vw, 150px);
    height: min(38vw, 150px);
    object-fit: cover;
    border-radius: 14px;
    border: 4px solid rgba(255,255,255,.9);
    box-shadow: 0 6px 16px rgba(0,0,0,.3);
  }

  /* Tarjeta del código QR estilo Spotify */
  .qr-card {
    margin-top: 26px;
    background: linear-gradient(160deg, #191414, #1f1a17);
    border-radius: 22px;
    padding: 20px 22px;
    text-align: center;
    box-shadow: 0 14px 34px rgba(0, 0, 0, .45), 0 0 0 2px rgba(30, 215, 96, .6);
    width: min(84vw, 320px);
  }
  .qr-cabeza {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .qr-cabeza svg { width: 32px; height: 32px; filter: drop-shadow(0 2px 6px rgba(30,215,96,.5)); }
  .qr-cabeza .t1 { font-size: 1.05rem; font-weight: 800; color: #1DB954; letter-spacing: .5px; }
  .qr-card .qr-titulo { font-size: 1.05rem; font-weight: 800; color: #fff; }
  .qr-card .qr-sub { font-size: .9rem; font-weight: 600; color: #b3b3b3; margin: 4px 0 14px; }
  .qr-card img {
    width: min(52vw, 200px);
    height: auto;
    border-radius: 12px;
    padding: 8px;
    background: #fff;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .4);
  }
  .qr-pista {
    margin-top: 14px;
    font-size: .82rem;
    font-weight: 800;
    color: #1DB954;
    letter-spacing: 2px;
  }
  @keyframes aparecer {
    from { transform: scale(.3); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .caida {
    position: fixed;
    top: -40px;
    font-size: 24px;
    z-index: 40;
    pointer-events: none;
    animation: caer linear forwards;
  }
  @keyframes caer {
    to { transform: translateY(115vh) rotate(320deg); }
  }

  /* ---------- Botón de música flotante ---------- */
  .btn-musica {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 50;
    width: 54px;
    height: 54px;
    border: none;
    border-radius: 50%;
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 8px 22px rgba(179, 36, 79, 0.3);
    touch-action: manipulation;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: latidoMusica 1.8s ease-in-out infinite;
  }
  .btn-musica.off { animation: none; opacity: .75; }
  @keyframes latidoMusica {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  #reproductor { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
</style>
</head>

  function ponerFotos() {
    const escena = document.getElementById('fotosEscena');
    const galeria = document.getElementById('galeriaFinal');
    if (!FOTOS_B64.length) {
      escena.style.display = 'none';
      galeria.style.display = 'none';
      return;
    }
    FOTOS_B64.forEach((src, i) => {
      const a = document.createElement('img');
      a.src = src; a.alt = 'foto ' + (i + 1);
      const b = document.createElement('img');
      b.src = src; b.alt = 'foto ' + (i + 1);
      escena.appendChild(a);
      galeria.appendChild(b);
    });
  }
  ponerFotos();

  const login = document.getElementById('login');
  const caja = document.getElementById('caja');
  const error = document.getElementById('error');
  const pantalla = document.getElementById('pantalla');
  const escena = document.getElementById('escena');
  const tulipan = document.getElementById('tulipan');
  const mensaje = document.getElementById('mensaje');

  // Calculadora de la fecha secreta (21+04+2025)
  let expr = '';

  // ============ MÚSICA (Amor de Cine - HUMBE) ============
  const btnMusica = document.getElementById('btnMusica');
  let musicaPlayer = null;
  let musicaActiva = false;

  window.onYouTubeIframeAPIReady = function () {
    musicaPlayer = new YT.Player('reproductor', {
      videoId: '4O1CNtVG7s8',
      playerVars: { playsinline: 1, rel: 0, controls: 0, loop: 1, playlist: '4O1CNtVG7s8' }
    });
  };

  function reproducirMusica() {
    if (musicaPlayer && musicaPlayer.playVideo) {
      musicaPlayer.playVideo();
      musicaActiva = true;
      btnMusica.textContent = '💖';
      btnMusica.classList.remove('off');
    }
  }
  function pausarMusica() {
    if (musicaPlayer && musicaPlayer.pauseVideo) {
      musicaPlayer.pauseVideo();
      musicaActiva = false;
      btnMusica.textContent = '🎵';
      btnMusica.classList.add('off');
    }
  }
  // Al primer toque en la calculadora, la canción suena sola
  function autoMusica() {
    if (!musicaActiva) reproducirMusica();
  }
  btnMusica.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    musicaActiva ? pausarMusica() : reproducirMusica();
  });

  function actualizarPantalla() {
    pantalla.textContent = expr || '0';
  }

  function entrar() {
    const val = expr.replace(/\D/g, '');
    if (val === FECHA_OK) {
      abrir();
    } else {
      error.classList.add('mostrar');
      caja.classList.remove('temblar');
      void caja.offsetWidth;
      caja.classList.add('temblar');
      expr = '';
      actualizarPantalla();
    }
  }

  document.querySelectorAll('.tecla').forEach(btn => {
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      autoMusica();
      const v = btn.dataset.val;
      if (v === 'C') { expr = ''; error.classList.remove('mostrar'); }
      else if (v === 'del') { expr = expr.slice(0, -1); error.classList.remove('mostrar'); }
      else if (v === '=') { entrar(); return; }
      else { expr = (expr + v).slice(0, 11); error.classList.remove('mostrar'); }
      pantalla.classList.remove('salta');
      void pantalla.offsetWidth;
      pantalla.classList.add('salta');
      actualizarPantalla();
    });
  });

  document.addEventListener('keydown', (e) => {
    if ((e.key >= '0' && e.key <= '9') || e.key === '+' || e.key === 'Enter' || e.key === '=' || e.key === 'Backspace' || e.key === 'Escape') autoMusica();
    if (e.key >= '0' && e.key <= '9') { expr = (expr + e.key).slice(0, 11); error.classList.remove('mostrar'); actualizarPantalla(); }
    else if (e.key === '+') { expr = (expr + '+').slice(0, 11); error.classList.remove('mostrar'); actualizarPantalla(); }
    else if (e.key === 'Enter' || e.key === '=') { entrar(); }
    else if (e.key === 'Backspace') { expr = expr.slice(0, -1); error.classList.remove('mostrar'); actualizarPantalla(); }
    else if (e.key === 'Escape') { expr = ''; error.classList.remove('mostrar'); actualizarPantalla(); }
  });

  function abrir() {
    login.classList.add('salir');
    setTimeout(() => login.style.display = 'none', 600);
    escena.classList.add('mostrar');
    tulipan.classList.add('florecer');
    corazonesFondo();
  }

  // Corazones amarillos flotando
  function corazonesFondo() {
    for (let i = 0; i < 16; i++) {
      const c = document.createElement('div');
      c.className = 'corazon-bg';
      c.textContent = '💛';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.fontSize = (18 + Math.random() * 26) + 'px';
      c.style.animationDuration = (7 + Math.random() * 8) + 's';
      c.style.animationDelay = (Math.random() * 8) + 's';
      document.body.appendChild(c);
    }
  }

  // Lluvia de corazones
  function lluvia(n) {
    const emojis = ['💛', '💛', '💛', '🌷', '💖'];
    for (let i = 0; i < n; i++) {
      setTimeout(() => {
        const c = document.createElement('div');
        c.className = 'caida';
        c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        c.style.left = Math.random() * 100 + 'vw';
        c.style.fontSize = (18 + Math.random() * 26) + 'px';
        c.style.animationDuration = (2.5 + Math.random() * 3) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 6000);
      }, i * 90);
    }
  }

  // Al tocar el tulipán
  tulipan.addEventListener('pointerdown', () => {
    mensaje.classList.add('mostrar');
    lluvia(60);
  });
</script>
</body>
</html>
